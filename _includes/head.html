<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="{{ page.description | default: site.description }}">
  <meta name="author" content="Joanna I. Sulkowska">
  <meta name="robots" content="index,follow">
  <title>{{ page.title | default: site.title }}</title>

  <!-- Original fonts: Open Sans + Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Merriweather:wght@700&display=swap" rel="stylesheet">

  <!-- Sulkowska Lab styles (extracted verbatim from original index.html) -->
  <link rel="stylesheet" href="{{ '/assets/css/sulkowska.css' | relative_url }}">

  <!-- Scripts loaded with defer so they execute after DOM is parsed but before DOMContentLoaded -->
  <script defer src="{{ '/assets/js/sulkowska.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/knot3d.js' | relative_url }}"></script>
</head>
