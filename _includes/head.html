<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="{{ page.description | default: site.description }}">
  <meta name="author" content="Joanna I. Sulkowska">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.openalex.org; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:;">
  <title>{{ page.title | default: site.title }}</title>

  {% assign asset_version = site.github.build_revision %}
  {% unless asset_version %}
    {% assign asset_version = site.time | date: "%s" %}
  {% endunless %}
  <link rel="stylesheet" href="{{ '/assets/css/sulkowska.css' | relative_url }}?v={{ asset_version }}">
</head>
