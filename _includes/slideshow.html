<div class="hero">
  <div class="hero-slideshow">
    <div class="hero-slide hero-slide-mesh" style="--hero-img: url('{{ '/assets/img/hero/sulkowska-mesh-banner.jpg' | relative_url }}');"></div>
    <div class="hero-slide hero-slide-publications" style="--hero-img: url('{{ '/assets/img/hero/publications-header.jpg' | relative_url }}');"></div>
    <div class="hero-slide hero-slide-projects active" style="--hero-img: url('{{ '/assets/img/hero/projects-header.jpg' | relative_url }}');"></div>
    <div class="hero-slide hero-slide-baner1" style="--hero-img: url('{{ '/assets/img/projects/baner1.png' | relative_url }}');"></div>
    <div class="hero-slide hero-slide-posters" style="--hero-img: url('{{ '/assets/img/hero/scientific-community-posters-wide.jpeg' | relative_url }}');"></div>

    <div class="slide-dots">
      <button class="slide-dot" type="button" onclick="goSlide(0)">1</button>
      <button class="slide-dot" type="button" onclick="goSlide(1)">2</button>
      <button class="slide-dot active" type="button" onclick="goSlide(2)">3</button>
      <button class="slide-dot" type="button" onclick="goSlide(3)">4</button>
      <button class="slide-dot" type="button" onclick="goSlide(4)">5</button>
    </div>
  </div>

  <div class="hero-content">
    <div class="hero-avatar">
      <img src="{{ '/assets/img/team/joannas.jpg' | relative_url }}" alt="Prof. Joanna Sulkowska">
    </div>
    <div class="hero-lab">Interdisciplinary Laboratory of Biological Systems Modelling</div>
    <div class="hero-name">Prof. Joanna I. Sulkowska</div>

  </div>
</div>
