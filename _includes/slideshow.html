{% assign slideshow = site.data.slideshow %}
<div class="hero">
  <div class="hero-slideshow">
    {% for slide in slideshow.slides %}
    <div class="hero-slide {{ slide.class }}{% if slide.active %} active{% endif %}" style="--hero-img: url('{{ slide.image | relative_url }}');"></div>
    {% endfor %}
  </div>

  <div class="hero-content">
    <div class="hero-avatar">
      <img src="{{ slideshow.avatar.image | relative_url }}" alt="{{ slideshow.avatar.alt | escape }}">
    </div>
    <div class="hero-lab">{{ slideshow.lab }}</div>
    <div class="hero-name">{{ slideshow.name }}</div>
  </div>
</div>
