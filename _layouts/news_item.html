---
layout: default
---
<article class="news-detail">

  <a class="news-back" href="{{ '/#sec-news' | relative_url }}">← Back to News</a>

  <div class="news-card">

    <div class="news-date">
      {{ page.date }}
    </div>

    <h1 class="news-title">
      {{ page.title }}
    </h1>

    <div class="news-body">
      {{ page.body }}
    </div>

  </div>
</article>
