hero:
  title: "From protein topology to targeted therapeutics"
  sub:   ""

domains:

  - id:     "topic-folding"
    number: "01"
    theme:  "folding"
    alt:    false
    title:  "Protein Folding & Energy Landscapes"
    layout: "right"

    figures:
      - href:    "https://doi.org/10.1073/pnas.1207864109"
        img:     "research/Picture3.png"
        img2x:   "research/Picture3@2x.png"
        width_class: "rx-figure-w-926"
        width:   926
        height:  325
        alt:     "DCA pipeline"
        caption: "DCA pipeline: MSA to structure prediction"
        wide:    true

    text: |
      Proteins with non-trivial topology — knots, slipknots, and lassos — pose one of structural biology's deepest questions: how does a linear chain reliably fold into a knot without getting permanently trapped? We build multidimensional energy-landscape models using coarse-grained Go-models and maximum-entropy approaches. Our central finding: **topological barriers** protect protein function and generate unique mechanical signatures measurable by single-molecule force spectroscopy.

    papers:
      - journal: "PNAS 2008"
        jclass:  "rx-journal-pnas"
        url:     "https://doi.org/10.1073/pnas.0805468105"
        title:   "Stabilizing effect of knots on proteins"
        authors: "Sulkowska, Sulkowski, Szymczak, Cieplak"
        cites:   "149 cit."

      - journal: "PNAS 2009"
        jclass:  "rx-journal-pnas"
        url:     "https://doi.org/10.1073/pnas.0811147106"
        title:   "Dodging the crisis of folding proteins with knots"
        authors: "Sulkowska, Sulkowski, Onuchic"
        cites:   "177 cit."

      - journal: "PNAS 2012"
        jclass:  "rx-journal-pnas"
        url:     "https://doi.org/10.1073/pnas.1207864109"
        title:   "Genomics-aided structure prediction"
        authors: "Sulkowska, Morcos, Weigt, Hwa, Onuchic"
        cites:   "251 cit."

  - id:     "topic-bioinformatics"
    number: "02"
    theme:  "bioinformatics"
    alt:    true
    title:  "Bioinformatics & Structure Prediction"
    layout: "left"

    figures:
      - href:    "https://doi.org/10.1073/pnas.1207864109"
        img:     "research/bioinf2.png"
        img2x:   "research/bioinf2@2x.png"
        width_class: "rx-figure-w-666"
        width:   666
        height:  287
        alt:     "MSA contact map"
        caption: "MSA alignment · conservation · contact map prediction"
        wide:    true

    text: |
      We build the computational infrastructure for proteome-scale topological analysis — our databases **KnotProt**, **AlphaKnot**, **LassoProt**, and **LinkProt** catalogue topological complexity across hundreds of thousands of structures. Analysing AlphaFold predictions, we were among the first to discover **new knot types** in the human proteome, including the rare 6₃ stevedore knot never seen in experimental data. Direct Coupling Analysis (DCA) further extracts co-evolutionary signals to predict 3D residue contacts from sequence alone.

    papers:
      - journal: "NAR 2014"
        jclass:  "rx-journal-nar"
        url:     "https://doi.org/10.1093/nar/gku1059"
        title:   "KnotProt: a database of proteins with knots and slipknots"
        authors: "Jamróz, Niemyska, Rawdon et al."
        cites:   "203 cit."

      - journal: "NAR 2022"
        jclass:  "rx-journal-nar"
        url:     "https://doi.org/10.1093/nar/gkac388"
        title:   "AlphaKnot: server to analyze entanglement in AlphaFold structures"
        authors: "Niemyska, Rubach, Greń et al."
        cites:   "37 cit."

      - journal: "Protein Sci. 2023"
        jclass:  "rx-journal-ps"
        url:     "https://doi.org/10.1002/pro.4631"
        title:   "AlphaFold predicts novel human proteins with knots"
        authors: "Perlinska, Niemyska, Greń et al."
        cites:   "33 cit."

  - id:     "topic-math"
    number: "03"
    theme:  "math"
    alt:    false
    title:  "Applied Mathematics & Knot Theory"
    layout: "right"

    figures:
      - href:    "https://doi.org/10.1073/pnas.1205918109"
        img:     "research/math1.png"
        img2x:   "research/math1@2x.png"
        width_class: "rx-figure-w-490"
        width:   490
        height:  245
        alt:     "Knot types survey"
        caption: "Knotted and slipknotted protein types"

      - href:    "https://doi.org/10.1093/nar/gkz845"
        img:     "research/math2.png"
        img2x:   "research/math2@2x.png"
        width_class: "rx-figure-w-510"
        width:   510
        height:  216
        alt:     "Seifert surface"
        caption: "Seifert surface · topological linking"

    text: |
      Classifying protein topology requires rigorous mathematics: we develop **knot polynomials** — Alexander, Jones, and HOMFLY methods — that uniquely identify knot types in open-chain biomolecules. We extend these tools to **Seifert surfaces** and **genus theory**, capturing topological complexity in both proteins and nucleic acids. Our open-source Topoly Python package makes these tools freely accessible to the community.

    papers:
      - journal: "PNAS 2012"
        jclass:  "rx-journal-pnas"
        url:     "https://doi.org/10.1073/pnas.1205918109"
        title:   "Conservation of complex knotting and slipknotting patterns"
        authors: "Sulkowska, Rawdon, Millett, Onuchic, Stasiak"
        cites:   "244 cit."

      - journal: "NAR 2019"
        jclass:  "rx-journal-nar"
        url:     "https://doi.org/10.1093/nar/gkz845"
        title:   "Genus for biomolecules"
        authors: "Rubach, Zajac, Jastrzebski, Sulkowska, Sułkowski"
        cites:   "13 cit."

      - journal: "Briefings Bioinf. 2020"
        jclass:  "rx-journal-bib"
        url:     "https://doi.org/10.1093/bib/bbaa196"
        title:   "Topoly: Python package to analyze topology of polymers"
        authors: "Dąbrowski-Tumański, Rubach et al."
        cites:   "69 cit."

  - id:     "topic-drug-design"
    number: "04"
    theme:  "drug-design"
    alt:    true
    title:  "Biochemistry & Drug Design"
    layout: "left"

    figures:
      - href:    "https://doi.org/10.1093/nar/gky1140"
        img:     "research/chem1.png"
        img2x:   "research/chem1@2x.png"
        width_class: "rx-figure-w-537"
        width:   537
        height:  260
        alt:     "Knotted vs unknotted fold"
        caption: "Knotted fold vs. unknotted fold - TrmD"

      - href:    "https://doi.org/10.1073/pnas.0805468105"
        img:     "research/chem2.png"
        img2x:   "research/chem2@2x.png"
        width_class: "rx-figure-w-489"
        width:   489
        height:  277
        alt:     "Antimicrobial drugs"
        caption: "Antimicrobial drug targets"

    text: |
      The **TrmD enzyme** — a tRNA methyltransferase essential for bacterial translation — owes its catalytic activity to a trefoil knot at its active site, a geometry impossible in unknotted proteins, making it a compelling **antibiotic target** with no structural human homologue. We apply DCA-guided computational docking and all-atom simulations to discover inhibitors for knotted proteins implicated in infectious disease, cancer, and neurodegeneration.

    papers:
      - journal: "NAR 2018"
        jclass:  "rx-journal-nar"
        url:     "https://doi.org/10.1093/nar/gky1140"
        title:   "KnotProt 2.0: database of proteins with knots and other entangled structures"
        authors: "Dąbrowski-Tumański, Rubach et al."
        cites:   "124 cit."

      - journal: "NAR 2024"
        jclass:  "rx-journal-nar"
        url:     "https://doi.org/10.1093/nar/gkae443"
        title:   "AlphaKnot 2.0: visualization of proteins' knotting"
        authors: "Rubach, Sikora, Jarmolinska et al."
        cites:   "11 cit."

      - journal: "Protein Sci. 2024"
        jclass:  "rx-journal-ps"
        url:     "https://doi.org/10.1002/pro.4998"
        title:   "Knot or not? Identifying unknotted proteins in knotted families with ML"
        authors: "Sikora, Klimentova, Uchal et al."
        cites:   "9 cit."

