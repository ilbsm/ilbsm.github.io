hero:
  title: "Projects & Software"
  sub: "Open-source databases, servers, and tools for studying the topology of proteins, genomes, and biomolecules."


layout:
  - pair: false
    sections:
      - id: "rp-topology"
        title: "Databases & Servers"
        theme: "topology"
        eyebrow: "Protein Topology"
        eyebrow_icon: "database"
        cards:
          - name: "AlphaKnot 2.0"
            url: "http://alphaknot.cent.uw.edu.pl"
            cat: "database server"
            img: "/assets/images/software/alphaknot.png"
            img_alt: "AlphaKnot"
            badge: "AlphaFold"
            desc: "Knot & knotoid detection across AlphaFold proteomes."

          - name: "AlphaLasso"
            url: "http://alphalasso.cent.uw.edu.pl"
            cat: "database server"
            img: "/assets/images/software/alphalasso.png"
            img_alt: "AlphaLasso"
            badge: "AlphaFold"
            desc: "Lasso topology classified across AlphaFold structures."

          - name: "KnotProt 2.0"
            url: "http://knotprot.cent.uw.edu.pl"
            cat: "database"
            img: "/assets/images/software/knotprot.jpg"
            img_alt: "KnotProt"
            desc: "Reference database of knotted proteins from the PDB."

          - name: "LassoProt"
            url: "http://lassoprot.cent.uw.edu.pl"
            cat: "database server"
            img: "/assets/images/software/lassoprot.jpg"
            img_alt: "LassoProt"
            desc: "Covalent lasso motifs, classified by piercing number."

          - name: "LinkProt"
            url: "http://linkprot.cent.uw.edu.pl"
            cat: "database"
            img: "/assets/images/software/linkprot.png"
            img_alt: "LinkProt"
            desc: "Topologically linked loops in protein structures."

  - pair: true
    sections:
      - id: "rp-plugins"
        title: "Plugins & Packages"
        theme: "plugins"
        eyebrow: "Topology Identification"
        eyebrow_icon: "tools"
        cards:
          - name: "Topoly"
            url: "http://topoly.cent.uw.edu.pl"
            cat: "plugin"
            img_bg_class: "bg-navy"
            logo_type: "topoly"
            logo_title: "Topoly"
            logo_subtitle: "Python Package"
            badge: "Package"
            badge_class: "badge-primary"
            desc: "Knot polynomials (Alexander, Jones, HOMFLY) for polymers."

          - name: "PyLasso"
            url: "http://pylasso.cent.uw.edu.pl"
            cat: "plugin"
            img: "/assets/images/software/pylasso.png"
            img_alt: "PyLasso"
            img_dark: true
            badge: "Plugin"
            badge_class: "badge-primary"
            desc: "Lasso detection with 3D visualization in PyMOL/VMD."

          - name: "PyLink"
            url: "http://pylink.cent.uw.edu.pl"
            cat: "plugin"
            img: "/assets/images/software/pylink.png"
            img_alt: "PyLink"
            img_dark: true
            badge: "Plugin"
            badge_class: "badge-primary"
            desc: "Topological link identification and visualization in PyMOL."

          - name: "Knot_pull"
            url: "https://github.com/dzarmola/knot_pull"
            cat: "plugin"
            img: "/assets/images/software/knot-pull.jpg"
            img_alt: "Knot_pull"
            badge: "GitHub"
            badge_class: "badge-github"
            desc: "Topology simplification via iterative chain pulling."

      - id: "rp-chromatin"
        title: "Chromatin & Genome Topology"
        theme: "chromatin"
        eyebrow: "Genomics"
        eyebrow_icon: "genomics"
        cards:
          - name: "KnotGenome"
            url: "http://knotgenom.cent.uw.edu.pl"
            cat: "chromatin database server"
            img: "/assets/images/software/knotgenome.png"
            img_alt: "KnotGenome"
            badge: "Server"
            badge_class: "badge-primary"
            desc: "Knots & links in chromatin fiber from polymer models."

  - pair: true
    sections:
      - id: "rp-mechanical"
        title: "Mechanical Properties"
        theme: "mechanical"
        eyebrow: "Molecular Mechanics"
        eyebrow_icon: "mechanics"
        cards:
          - name: "BSDB — Bio-molecule Stretching Database"
            url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3013760/"
            cat: "database"
            img: "/assets/images/software/bsdb-stretch.png"
            img_alt: "BSDB"
            img_bg_class: "bg-soft-gray"
            desc: "Force-extension data from coarse-grained simulations."

          - name: "Genus for Biomolecules"
            url: "https://genus.fuw.edu.pl/"
            cat: "database server"
            img: "/assets/images/software/genus.png"
            img_alt: "Genus"
            img_bg_class: "bg-soft-blue"
            desc: "Topological genus of proteins and RNA via minimal surfaces."

      - id: "rp-prediction"
        title: "Structure Prediction"
        theme: "prediction"
        eyebrow: "Co-evolution Methods"
        eyebrow_icon: "shield"
        cards:
          - name: "DCA-mol"
            url: "http://dca-mol.cent.uw.edu.pl"
            cat: "prediction server"
            img: "/assets/images/software/dca-mol.png"
            img_alt: "DCA-mol"
            img_bg_class: "bg-cool-blue"
            badge: "Server"
            badge_class: "badge-blue"
            desc: "Evolutionary couplings from MSA for structure prediction."

          - name: "PconsFam"
            url: "http://pconsfam.bioinfo.se/"
            cat: "prediction database"
            img: "/assets/images/software/pconsfam.png"
            img_alt: "PconsFam"
            img_bg_class: "bg-white"
            desc: "Contact-assisted models for thousands of Pfam families."

          - name: "GapRepairer"
            url: "http://gaprepairer.cent.uw.edu.pl"
            cat: "server prediction"
            img: "/assets/images/software/gaprepairer.jpg"
            img_alt: "GapRepairer"
            badge: "Server"
            badge_class: "badge-blue"
            desc: "Reconstructs missing backbone fragments in PDB structures."

  - pair: false
    sections:
      - id: "rp-computing"
        title: "Computing Infrastructure"
        theme: "computing"
        eyebrow: "HPC Resources"
        eyebrow_icon: "server"
        cards:
          - name: "Horda Cluster"
            url: "https://ilbsm.github.io/horda/"
            cat: "server"
            img_bg_class: "bg-navy"
            logo_type: "simple"
            logo_title: "HORDA"
            logo_subtitle: "HPC Cluster · CeNT UW"
            desc: "Primary HPC cluster for large-scale topology simulations."

          - name: "LSSCB Cluster"
            url: "https://lsscb.cent.uw.edu.pl"
            cat: "server"
            img_bg_class: "bg-navy"
            logo_type: "cent"
            logo_title: "CeNT"
            logo_subtitle: "LSSCB Cluster"
            desc: "Shared HPC infrastructure for structural bioinformatics."

        resources:
          title: "HORDA resources"
          intro: "HORDA supports large-scale topology simulations, molecular modelling, and analysis workflows used across lab research projects."
          url: "https://ilbsm.github.io/horda/"
          stats:
            - value: "228"
              label: "physical CPUs"
              sub: "348 virtual CPUs"
            - value: "22"
              label: "GPUs"
            - value: "736 GB"
              label: "RAM"
            - value: "around 45 TB"
              label: "shared storage"
          software:
            - "Amber 18 (with AmberTools)"
            - "CUDA 11.5"
            - "CUDA 12.2"
            - "Gromacs 2023.1"
            - "Gromacs with CP2K 2023.1"
            - "Python 3.9"
            - "Python 3.10"
            - "Python 3.11"
            - "SageMath 9.5-4"
