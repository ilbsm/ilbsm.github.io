# Projects & Software page — edit here to update everything on the /topics/ page
# Non-coders: only edit the text fields (name, url, desc, badge, etc.)
# Do NOT change eyebrow_icon or img_logo_html unless you know HTML/SVG

hero:
  title: "Projects & Software"
  sub: "Open-source databases, servers, and tools for studying the topology of proteins, genomes, and biomolecules."

# Layout: list of rows. Each row is either a single section (pair: false) or two side-by-side sections (pair: true).
# Each section has: id, title, color, eyebrow, eyebrow_icon, knot_type, knot_color, knot_speed, knot_tilt, cards
# Each card has: name, url, cat, desc, and image fields (img OR img_logo_html), plus optional badge/badge_color

layout:
  - pair: false
    sections:
      - id: "rp-topology"
        title: "Databases & Servers"
        color: "#1a7a7e"
        eyebrow: "Protein Topology"
        eyebrow_icon: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>'
        knot_type: "trefoil"
        knot_color: "#1a73e8"
        knot_speed: 0.009
        knot_tilt: 0.5
        cards:
          - name: "AlphaKnot 2.0"
            url: "http://alphaknot.cent.uw.edu.pl"
            cat: "database server"
            img: "/assets/img/software/alphaknot.png"
            img_alt: "AlphaKnot"
            badge: "AlphaFold"
            desc: "Knot & knotoid detection across AlphaFold proteomes."

          - name: "AlphaLasso"
            url: "http://alphalasso.cent.uw.edu.pl"
            cat: "database server"
            img: "/assets/img/software/alphalasso.png"
            img_alt: "AlphaLasso"
            badge: "AlphaFold"
            desc: "Lasso topology classified across AlphaFold structures."

          - name: "KnotProt 2.0"
            url: "http://knotprot.cent.uw.edu.pl"
            cat: "database"
            img: "/assets/img/software/knotprot.jpg"
            img_alt: "KnotProt"
            desc: "Reference database of knotted proteins from the PDB."

          - name: "LassoProt"
            url: "http://lassoprot.cent.uw.edu.pl"
            cat: "database server"
            img: "/assets/img/software/lassoprot.jpg"
            img_alt: "LassoProt"
            desc: "Covalent lasso motifs, classified by piercing number."

          - name: "LinkProt"
            url: "http://linkprot.cent.uw.edu.pl"
            cat: "database"
            img: "/assets/img/software/linkprot.png"
            img_alt: "LinkProt"
            desc: "Topologically linked loops in protein structures."

  - pair: true
    sections:
      - id: "rp-plugins"
        title: "Plugins & Packages"
        color: "#1e6e8a"
        eyebrow: "Topology Identification"
        eyebrow_icon: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>'
        knot_type: "lasso"
        knot_color: "#7b1fa2"
        knot_speed: 0.007
        knot_tilt: 0.35
        cards:
          - name: "Topoly"
            url: "http://topoly.cent.uw.edu.pl"
            cat: "plugin"
            img_bg: "#0b1f2e"
            img_logo_html: '<svg viewBox="0 0 120 80" width="90" height="60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5" stroke-linecap="round" style="position:absolute;top:12px;right:12px"><path d="M30 20 Q60 5 90 20 Q105 35 90 50 Q60 65 30 50 Q15 35 30 20Z"/><path d="M45 28 Q60 18 75 28 Q82 38 75 48 Q60 58 45 48 Q38 38 45 28Z"/></svg><span style="font-size:2.4rem;font-weight:900;color:#fff;font-family:Merriweather,serif;letter-spacing:-2px;line-height:1">Topoly</span><span style="font-size:0.6rem;color:rgba(255,255,255,0.4);letter-spacing:0.15em;text-transform:uppercase;margin-top:0.3rem">Python Package</span>'
            badge: "Package"
            badge_color: "#1e6e8a"
            desc: "Knot invariants (Alexander, Jones, HOMFLY) for polymers."

          - name: "PyLasso"
            url: "http://pylasso.cent.uw.edu.pl"
            cat: "plugin"
            img: "/assets/img/software/pylasso.png"
            img_alt: "PyLasso"
            img_dark: true
            badge: "Plugin"
            badge_color: "#1e6e8a"
            desc: "Lasso detection with 3D visualization in PyMOL/VMD."

          - name: "PyLink"
            url: "http://pylink.cent.uw.edu.pl"
            cat: "plugin"
            img: "/assets/img/software/pylink.png"
            img_alt: "PyLink"
            img_dark: true
            badge: "Plugin"
            badge_color: "#1e6e8a"
            desc: "Topological link identification and visualization in PyMOL."

          - name: "Knot_pull"
            url: "https://github.com/dzarmola/knot_pull"
            cat: "plugin"
            img: "/assets/img/software/knot-pull.jpg"
            img_alt: "Knot_pull"
            badge: "GitHub"
            badge_color: "#24292e"
            desc: "Topology simplification via iterative chain pulling."

      - id: "rp-chromatin"
        title: "Chromatin & Genome Topology"
        color: "#366094"
        eyebrow: "Genomics"
        eyebrow_icon: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 3H3v7a6 6 0 0 0 12 0V3"/><path d="M6 21v-4a6 6 0 0 1 12 0v4"/></svg>'
        knot_type: "hopf"
        knot_color: "#c62828"
        knot_speed: 0.008
        knot_tilt: 0.45
        cards:
          - name: "KnotGenome"
            url: "http://knotgenom.cent.uw.edu.pl"
            cat: "chromatin database server"
            img: "/assets/img/software/knotgenome.png"
            img_alt: "KnotGenome"
            badge: "Server"
            badge_color: "#366094"
            desc: "Knots & links in chromatin fiber from polymer models."

  - pair: true
    sections:
      - id: "rp-mechanical"
        title: "Mechanical Properties"
        color: "#1c6492"
        eyebrow: "Molecular Mechanics"
        eyebrow_icon: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>'
        knot_type: "slipknot"
        knot_color: "#da7101"
        knot_speed: 0.008
        knot_tilt: 0.4
        cards:
          - name: "BSDB — Bio-molecule Stretching Database"
            url: "http://jowisz.ifpan.edu.pl/BSDB/"
            cat: "database"
            img: "/assets/img/software/bsdb-stretch.png"
            img_alt: "BSDB"
            img_bg: "#f5f5f5"
            img_contain: true
            desc: "Force-extension data from coarse-grained simulations."

          - name: "Genus for Biomolecules"
            url: "http://genus.fuw.edu.pl"
            cat: "database server"
            img: "/assets/img/software/genus.png"
            img_alt: "Genus"
            img_bg: "#f0f4ff"
            img_contain: true
            desc: "Topological genus of proteins and RNA via minimal surfaces."

      - id: "rp-prediction"
        title: "Structure Prediction"
        color: "#2a6896"
        eyebrow: "Co-evolution Methods"
        eyebrow_icon: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'
        knot_type: "torus"
        knot_color: "#2e7d32"
        knot_speed: 0.006
        knot_tilt: 0.6
        cards:
          - name: "DCA-mol"
            url: "http://dca-mol.cent.uw.edu.pl"
            cat: "prediction server"
            img: "/assets/img/software/dca-mol.png"
            img_alt: "DCA-mol"
            img_bg: "#f0f4f8"
            img_contain: true
            badge: "Server"
            badge_color: "#2a6896"
            desc: "Evolutionary couplings from MSA for structure prediction."

          - name: "PconsFam"
            url: "http://pconsfam.bioinfo.se/"
            cat: "prediction database"
            img: "/assets/img/software/pconsfam.png"
            img_alt: "PconsFam"
            img_bg: "#fff"
            img_contain: true
            desc: "Contact-assisted models for thousands of Pfam families."

          - name: "GapRepairer"
            url: "http://gaprepairer.cent.uw.edu.pl"
            cat: "server prediction"
            img: "/assets/img/software/gaprepairer.jpg"
            img_alt: "GapRepairer"
            badge: "Server"
            badge_color: "#2a6896"
            desc: "Reconstructs missing backbone fragments in PDB structures."

  - pair: false
    sections:
      - id: "rp-computing"
        title: "Computing Infrastructure"
        color: "#3a5a90"
        eyebrow: "HPC Resources"
        eyebrow_icon: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>'
        knot_type: "helix"
        knot_color: "#4db8e8"
        knot_speed: 0.01
        knot_tilt: 0.3
        cards:
          - name: "Horda Cluster"
            url: "https://horda.cent.uw.edu.pl"
            cat: "server"
            img_bg: "#1c313a"
            img_logo_html: '<span style="font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-1px;font-family:Merriweather,serif">HORDA</span><span style="font-size:0.58rem;color:rgba(255,255,255,0.4);letter-spacing:0.15em;text-transform:uppercase">HPC Cluster · CeNT UW</span>'
            desc: "Primary HPC cluster for large-scale topology simulations."

          - name: "LSSCB Cluster"
            url: "https://cent.uw.edu.pl"
            cat: "server"
            img_bg: "#263238"
            img_logo_html: '<span style="font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-1px;font-family:Arial">C<span style="color:#4fc3f7;font-size:0.8em">e</span>NT</span><span style="font-size:0.58rem;color:rgba(255,255,255,0.4);letter-spacing:0.15em;text-transform:uppercase">LSSCB Cluster</span>'
            desc: "Shared HPC infrastructure for structural bioinformatics."
