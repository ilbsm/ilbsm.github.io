- id:          cost-eutopia
  title:       "COST - EUTOPIA"
  image:       "/assets/img/projects/eutopia.jpg"
  alt:         "EUTOPIA network graphic"
  cover:       true
  badge:       "COST"
  badge_class: "rx-funder-cost"
  meta:        "EUTOPIA Network · PI: Sulkowska"
  summary:     "European topology network connected to the lab's work on knots, slipknots, lassos, links, and the free-energy landscape of entangled proteins."
  detail: |
    COST - EUTOPIA is the European network connected to the laboratory's programme on protein entanglement. On this site it is grouped with the lab's wider effort to classify entangled proteins and understand their free-energy landscapes.

    The programme goes beyond classical knotted proteins by bringing complex lasso proteins and links into the same framework, connecting theoretical models with experimental validation.
  links:
    - label: "COST action overview"
      url:   "https://www.cost.eu/actions/CA17139/#tabs|Name:overview"

- id:          ideas-plus-entanglement
  title:       "Classification and Free Energy Landscape of Entanglement Proteins"
  image:       "/assets/img/projects/ideasplus.png"
  alt:         "Ideas Plus project figure"
  badge:       "MNiSW"
  badge_class: "rx-funder-mnisw"
  meta:        "Ideas Plus II Grant · MNiSW"
  polish_title: "Białka splątane - studium nowych struktur i rozwiązanie ich zagadki"
  summary:     "Studies knots, slipknots, lassos, and protein links, with a focus on the mechanical and energetic landscape of non-trivially entangled structures."
  detail: |
    This project focuses on entanglement in proteins: knots, slipknots, tadpoles, lassos, and links. These geometries are not visible in ordinary primary, secondary, or tertiary structure descriptions, but they can be essential for understanding folding, dynamics, and function.

    The central goal is to understand the energy landscape of tangled protein structures through mechanical manipulation models. Theoretical predictions are designed to be supported and checked experimentally.
  links:
    - label: "LassoProt"
      url:   "http://lassoprot.cent.uw.edu.pl"
    - label: "LinkProt"
      url:   "http://linkprot.cent.uw.edu.pl"
    - label: "Mechanical manipulation reference"
      url:   "http://www.pnas.org/content/98/7/3658.full.pdf"
    - label: "Sulkowska et al."
      url:   "http://pubs.acs.org/doi/abs/10.1021/ja102441z"

- id:          sonata-bis-knotted-function
  title:       "Influence of Knotted Structure on Function of Proteins and Protein Structure Prediction"
  image:       "/assets/img/projects/baner1.png"
  alt:         "Protein structure prediction and knotted proteins"
  badge:       "NCN"
  badge_class: "rx-funder-ncn"
  meta:        "Sonata BIS Grant · PI: Sulkowska"
  summary:     "Examines how knots relate to active sites, molecular motion, co-evolving amino-acid pairs, and DCA-guided structure prediction."
  detail: |
    The main goal is to understand the role and function of knots in proteins. The project tests the hypothesis that knots and other non-trivial geometries, including slipknots, correlate with functional properties of proteins.

    The work asks whether knot geometry is connected with active-site location, molecular motion, and co-evolving amino-acid pairs. Because knotted proteins are difficult to study experimentally, the project develops theoretical approaches as the first route to understanding their function.
  links:
    - label: "Mansfield 1994"
      url:   "https://doi.org/10.1038/nsb0494-213"
    - label: "Slipknots reference"
      url:   "http://journals.aps.org/prl/abstract/10.1103/PhysRevLett.103.268103"
    - label: "Function reference"
      url:   "http://www.pnas.org/content/109/26/E1715.full"

- id:          embo-installation-knotted-proteins
  title:       "Comprehensive Analysis of Knotted Proteins"
  image:       "/assets/img/projects/embo.png"
  alt:         "EMBO logo"
  badge:       "EMBO"
  badge_class: "rx-funder-embo"
  meta:        "Installation Grant · PI: Sulkowska"
  summary:     "Uses simulations and experimental techniques to study how non-trivial topology contributes to biological function in knotted proteins."
  detail: |
    This project studies proteins whose backbones form knots. Pulling a knotted protein by its termini would tighten the knot, while an unknotted protein would unfold into a chain.

    The project asks how a single, topologically complex protein can perform biological work that might otherwise require several interacting parts. It focuses especially on understanding how knots affect function, using computer simulations and experimental techniques.

    One motivation comes from methylation enzymes: in some organisms, reactions can depend on complex protein-RNA assemblies, while in others they are carried out by a single enzyme whose knotted topology may be functionally important.
  links:
    - label: "Sulkowska et al. PNAS 2012"
      url:   "http://www.pnas.org/content/109/26/E1715.full"
    - label: "Slipknot reference"
      url:   "http://www.sciencedirect.com/science/article/pii/S0022283607009813"
    - label: "NSMB TrmD work"
      url:   "http://www.nature.com/nsmb/journal/v23/n10/full/nsmb.3282.html"

- id:          fnp-mathematical-lasso
  title:       "Can Biology Be Caught on a Mathematical Lasso?"
  image:       "/assets/img/projects/Inter_Wanda.png"
  alt:         "Mathematical lasso project figure"
  badge:       "FNP"
  badge_class: "rx-funder-fnp"
  meta:        "INTER Grant · PI: Niemyska"
  polish_title: "Czy biologię da się schwytać na matematyczne lasso?"
  summary:     "Builds mathematical and physical tools for uncovering how recently discovered lasso-like protein topologies fold."
  detail: |
    The aim is to use theory from mathematics and physics, especially the geometry of curves and surfaces in three-dimensional space, to create tools for studying lasso-like protein topologies.

    The project focuses on uncovering the folding process of recently discovered protein structures whose topology resembles a lasso.

- id:          dsm-lasso-structure-function
  title:       "Characterization of Structure-Function Relation in Proteins with Lassos"
  image:       "/assets/img/projects/sonatabis2.png"
  alt:         "Lasso protein topology figure"
  badge:       "UW"
  badge_class: "rx-funder-uw"
  meta:        "DSM Grant · PI: Dąbrowski-Tumański"
  polish_title: "Charakteryzacja zależności struktura-funkcja w białkach o topologii typu lasso"
  summary:     "Connects lasso topology with protein structure, function, and methods that later support lasso-motif analysis."
  detail: |
    This project characterizes the relationship between protein structure and function in proteins with lasso topology.

    The work develops ways to describe lasso motifs and their functional implications, supporting the broader effort to detect, classify, and analyse lasso proteins.

- id:          embo-trmd-inhibitors
  title:       "Synthesis of Inhibitors for TrmD Proteins"
  image:       "/assets/img/projects/embo_small.png"
  alt:         "Synthetic scheme for TrmD inhibitors"
  badge:       "EMBO"
  badge_class: "rx-funder-embo"
  meta:        "Small Grant · PI: Sulkowska"
  summary:     "Targets the knotted TrmD tRNA methyltransferase by synthesizing and testing selective ligand candidates."
  detail: |
    The goal is to find selective inhibitors for the knotted TrmD tRNA methyltransferase.

    The first step is to synthesize and test three ligands previously suggested as selective by AstraZeneca. The project is carried out in collaboration with the Jacek Jemielity group.
  links:
    - label: "Jacek Jemielity group"
      url:   "http://www.jemielitygroup.pl/"
    - label: "Ligand reference"
      url:   "http://pubs.acs.org/doi/abs/10.1021/jm400718n"

- id:          icm-trmd-ligand-binding
  title:       "Great Challenges - TrmD Ligand Binding"
  image:       "/assets/img/projects/2.png"
  alt:         "TrmD ligand binding project banner"
  badge:       "ICM"
  badge_class: "rx-funder-icm"
  meta:        "Computational Grant · PI: Sulkowska"
  summary:     "Uses computation to study how non-trivial topology influences ligand binding in the TrmD protein family."
  detail: |
    This project investigates the influence of non-trivial topology on ligand binding in the TrmD family.

    TrmD proteins are characterized by a knot that forms an active site, which means topology can directly affect biological function through interactions with ligands. The work is carried out in cooperation with experimentalists in the Ya-Ming Hou group at Thomas Jefferson University, who determined structures of proteins with ligands and tRNA.
  links:
    - label: "Ito et al."
      url:   "http://www.nature.com/nsmb/journal/v23/n10/full/nsmb.3282.html"

- id:          dsm-macrocyclic-links
  title:       "Development of Methodology to Uncover Macrocyclic Links in Proteins"
  image:       "/assets/img/projects/DSM_macrolinks.png"
  alt:         "Macrocyclic link topology figure"
  badge:       "UW"
  badge_class: "rx-funder-uw"
  meta:        "DSM Grant · PI: Dąbrowski-Tumański"
  polish_title: "Opracowanie metodologii wykrywania splotów makrocykliczych w białkach"
  summary:     "Develops methods for automated detection and classification of macrocyclic links in protein structures."
  detail: |
    This project develops methodology for detecting macrocyclic links in proteins.

    The work supports automated topological classification and analysis of linked protein motifs, helping make complex protein link topologies easier to identify and compare.

- id:          ncn-preludium-link-topology
  title:       "Identification and Characterization of Proteins with Link Topology"
  image:       "/assets/img/projects/preludium.png"
  alt:         "Protein link topology project figure"
  badge:       "NCN"
  badge_class: "rx-funder-ncn"
  meta:        "Preludium Grant · PI: Dąbrowski-Tumański"
  polish_title: "Identyfikacja i charakteryzacja białek o topologii splotu"
  summary:     "Creates methods to detect link topology, classify linked proteins, and support the LinkProt server and database."
  detail: |
    The aims are to develop new methods for automatically detecting link topology in protein structures, perform topological classification, and create a publicly available server and database: LinkProt.

    The project also studies folding, determines free-energy landscapes of linked proteins, and searches for the influence of topology on protein function and properties. Simulations are supported by mathematical tools from knot theory and the theory of minimal surfaces.
  links:
    - label: "LinkProt"
      url:   "http://linkprot.cent.uw.edu.pl"
